<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KICK-OFF | Start Your Day</title>

  <link rel="stylesheet" href="css/style.css">
</head>

<body>

  <header class="container">
    <h1>KICK-OFF</h1>
    <p>Start Your Day.</p>
  </header>

  <main class="container">

    <section id="menu">
      <h2 class="section-title">เมนูเครื่องดื่ม</h2>

      <div id="menu-list" class="menu-grid">
        <p>กำลังโหลดเมนู...</p>
      </div>
    </section>
<section id="shopping-cart">
      <h2 class="section-title">ตะกร้าสินค้าของคุณ</h2>

      <div class="product-card">
        <p>จำนวนสินค้า: <span id="cart-count">0</span> รายการ</p>

        <div id="cart-items">
          <p>ยังไม่มีสินค้าในตะกร้า</p>
        </div>

        <div class="product-price">
          ยอดรวม: <span id="cart-total">0 บาท</span>
        </div>
      </div>
    </section>
  </main>

  <footer class="container">
    <p>KICK-OFF | Start Your Day.</p>
    <p>เปิดบริการ 06:30 - 16:30</p>
  </footer>

  <script src="js/menu.js"></script>
  <script src="js/menu-display.js"></script>
   <script src="js/cart.js"></script>

</body>
</html>
